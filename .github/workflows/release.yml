# Publish a GitHub Release when a v* tag is pushed (e.g. v0.1.0; a tag with
# a hyphen such as v0.2.0-rc1 becomes a prerelease). The release carries a
# prebuilt Linux x86_64 asynctp + asynctp-lsp and the asyncrt headers; GitHub
# attaches the source archives itself.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (linux-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: gcc:15          # same toolchain as ci.yml
    env:
      CC: gcc
      CXX: g++
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install CMake (not in the gcc image)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          g++ --version | head -n1
          cmake --version | head -n1
          case "$(g++ -dumpversion)" in
            15*) ;;
            *) echo "::error::expected GCC 15, got $(g++ -dumpversion)"; exit 1 ;;
          esac

      # A release is cut only from a tree that passes everything ci.yml
      # checks, plus ASan, whatever state the tagged commit's CI was in.
      - name: verify.sh all
        run: .claude/skills/verify/scripts/verify.sh all

      # Static libstdc++/libgcc: GCC 15's libstdc++ is newer than most
      # distros ship. glibc stays dynamic, so the binaries need a glibc at
      # least as new as Debian trixie's (2.41).
      - name: Build release binaries
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build-release --parallel --target asynctp asynctp-lsp

      - name: Package
        run: |
          name="dotawait-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "dist/$name/bin" "dist/$name/include"
          cp build-release/transpiler/asynctp build-release/transpiler/asynctp-lsp "dist/$name/bin/"
          strip "dist/$name/bin/"*
          cp -r runtime/include/asyncrt "dist/$name/include/"
          cp LICENSE README.md "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      # The packaged transpiler and headers must work on their own, outside
      # the build tree.
      - name: Smoke-test the package
        run: |
          pkg="dist/dotawait-${GITHUB_REF_NAME}-linux-x86_64"
          "$pkg/bin/asynctp" examples/hello.async.cpp -o hello.cpp
          g++ -std=c++20 -I"$pkg/include" hello.cpp -o hello
          ./hello

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job with write access. It runs no repository code: it only
    # downloads the build job's artifact and calls gh.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-x86_64
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes --verify-tag "${flags[@]}"
